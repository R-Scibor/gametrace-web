services:
  gametrace-web:
    build:
      context: .
      args:
        VITE_DISCORD_SERVER_INVITE_URL: ${VITE_DISCORD_SERVER_INVITE_URL:-}
        VITE_DISCORD_BOT_INVITE_URL: ${VITE_DISCORD_BOT_INVITE_URL:-}
    container_name: gametrace-web
    restart: unless-stopped
    ports:
      - "8020:80"
    volumes:
      - ./downloads:/var/downloads:ro
    networks:
      - gametrace-backend_default

networks:
  gametrace-backend_default:
    external: true
