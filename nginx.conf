server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  # Re-resolve gametrace_api on each request — avoids 502 after backend container restart.
  resolver 127.0.0.11 valid=30s;
  set $api_upstream http://gametrace_api:8010;

  location = /download/gametrace.apk {
    alias /var/downloads/gametrace.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="gametrace.apk"';
  }

  # Canonicalize the SPA hub URL so /download never falls through to a
  # non-matching client route → catch-all → / → ProtectedRoute → /welcome.
  # Relative Location keeps Host/port/scheme (critical behind NPM/Cloudflare).
  absolute_redirect off;
  location = /download {
    return 302 /download/;
  }

  location / { try_files $uri $uri/ /index.html; }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /covers/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}